// Executed after course.cfg
// Copy this file to /home/steam/cs2/custom_files/cfg/ and add your custom settings
// The folder should exist once the install script has ran once
// The contents of /home/steam/cs2/custom_files/ is automatically copied and merged into /home/steam/cs2/game/csgo/

// Fallschaden an: Die Course-Maps lassen dich beim Runterfallen sterben und neu starten.
// (settings/kz_on.cfg schaltet ihn sonst aus, dann bleibt man unten haengen.)
sv_falldamage_scale 1

// CourseFix: Wer tiefer als so viele Einheiten faellt, kommt automatisch zum letzten
// Checkpoint (!tp) bzw. zum Start (!r) zurueck. 0 = aus. Zum Vergleich: ein normaler
// Sprung ist ca. 55 Einheiten hoch, ein Spieler ca. 72 Einheiten gross.
coursefix_fall_height 400
